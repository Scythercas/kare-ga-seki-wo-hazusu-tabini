# 彼が席を外すたびに｜シーン原本
#
# ここが台本の実データの原本。編集したら必ず次を実行すること：
#     python build_scenes.py && python validate_scenes.py
# 書きかたは docs/シーンYAMLの書きかた.md を参照。

meta:
  title: 彼が席を外すたびに
  source: 台本.md

scenes:

  # ───────────────────────────────────────────
  - id: scene_01
    見出し: 遭遇
    背景: bg_station
    BGM: bgm_daily
    本文:
      - 友人と二人、駅前の通りを歩いていた。特に予定があったわけではない。
      - 土曜の昼過ぎ、休日にしては人がまばらで、街全体が少し気を抜いているような時間だった。
      - 学生の頃から、こいつとはこうやって目的もなく歩くことが多かった。社会人になってから会う頻度は減ったが、顔を合わせればすぐに当時の距離感に戻る。
      - そんな時、通りの向こうから、友人の名前を呼ぶ声がした。
      - 彼女: あ……{{friendName}}の……友達、だよね？前に写真で見たことある気がする
        声: voice_01
        表情: fluster
      - 写真で見たことがある、というのはこちらの台詞でもあった。何度か見せられたことがある。
      - ただ、実物のほうがずっと表情の動く人だと思った。
      - 彼女: ごめんなさい、急に声かけて。買い物の帰りで、たまたま
      - そう言って彼女は、手に提げた袋を少しだけ持ち上げてみせた。
      - 特に意味のある仕草ではない。何か言わなければ、と思ったのだと思う。
      - 友人: お、奇遇だな。彼女だよ。……せっかくだし、3人で少し遊んでいくか？
        表情: { 友人: normal, 彼女: normal }
      - 彼女は迷うように、隣の友人を見上げた。
      - 断るとも、賛成するとも取れる表情だった。
      - 友人は返事を待つように、こちらを見ている。
    選択肢:
      id: choice_01
      効果音: se_select
      options:
        - A: 「いいね、ちょうど暇してた」
        - B: 「お邪魔じゃないか？」
          警戒度: -1
    次: scene_02

  # ───────────────────────────────────────────
  - id: scene_02
    見出し: 合流〜カフェ
    背景: bg_cafe
    本文:
      - 近くのカフェに入り、3人で他愛のない話をする。彼女は終始、友人の恋人らしく振る舞っている。表面上は、ただの三人の時間。
      - 友人: こいつとは大学からの仲でさ、当時はよくつるんでたんだよ
        表情: { 友人: normal, 彼女: normal }
      - 彼女: へえ、意外。{{friendName}}がそんな風に懐くタイプって、あんまり想像つかないかも
      - 友人: 懐くって言い方やめろって（笑）
        表情: smile
      - 友人が声を上げて笑う。
      - 彼女: だって、私の前だとけっこう気を張ってるもん。今日みたいに笑ってるの、あんまり見ないし
      - 友人: そんなことねえだろ
        表情: normal
      - 地の文: 彼女は笑って、それ以上は言わなかった。
        表情: { 彼女: smile }
      - 運ばれてきたコーヒーに口をつけながら、彼女がこちらを見る。
      - 彼女: 大学のとき、どんな感じだったんですか。この人
      - その質問は友人にではなく、明確にこちらへ向けられていた。
      - 友人は「余計なこと言うなよ」と笑いながら、まんざらでもない顔をしている。
      - 地の文: 思い出話をいくつか話すと、彼女は声を出して笑った。
        表情: { 彼女: laugh }
      - さっきまでの、恋人の隣にいる時の笑い方とは、少しだけ違っていた。
      - 友人: な、こいつ話すの上手いだろ。昔からそうなんだよ
        表情: smile
      - 地の文: 友人は満足そうにそう言って、それきりスマホに目を落とした。
        表情: { 友人: normal }
      - 彼女: いいなあ、そういうの。私、大学のときの友達とはもう全然会わなくて
      - 友人: 連絡すりゃいいじゃん
      - 彼女: そういうもんじゃないでしょ
      - 地の文: 彼女はそれきり、窓の外に目をやった。
        表情: { 彼女: away }
      - その横顔を、友人は見ていなかった。
      - 何も、変なことは起きていない。ただの三人の午後だった。
    次: scene_03

  # ───────────────────────────────────────────
  - id: scene_03
    見出し: 離脱①（トイレ）
    背景: bg_cafe
    本文:
      - 「ちょっとトイレ」と友人が席を立つ。残された2人に、少し気まずいような、そうでもないような空気が流れる。
      - 初対面の相手と二人きりになるのは、それが誰であっても少し落ち着かない。
      - 友人: わりい、店員さん呼んどいてくれる？水もらいたいから
        表情: { 友人: normal, 彼女: normal }
      - 地の文: 彼女は一瞬だけ、その背中を目で追った。
        表情: { 友人: null }
      - 「呼んどいて」と言われたのが自分なのか、こちらなのか、判断がつかなかったのだと思う。
      - 三人ぶんのグラスが並んだテーブルに、二人だけが残された。
      - 会話が、ふつりと途切れる。
      - 彼女: ……あ、
      - 彼女が小さく手を挙げかけて、途中でやめた。
      - 店員がこちらへ歩いてくる。あと数歩で、テーブルの横に着く。
    選択肢:
      id: choice_03
      効果音: se_select
      options:
        - A: 「（店員に）すみません、お水いただけますか」
          好感度: 1
        - B: 何も言わず様子を見る
    選択後:
      - 彼女: ……ありがとう。{{friendName}}、ああいうところ雑なんだよね
        声: voice_02
        表情: smug
        条件: choice_03 == A
      - 地の文: その「ありがとう」は、水のことだけを指しているようには聞こえなかった。
        条件: choice_03 == A
    次: scene_04

  # ───────────────────────────────────────────
  - id: scene_04
    見出し: 再開①（街を歩く）
    背景: bg_cafe
    本文:
      # Scene3 の選択によって、友人が戻ってきたときの状況が変わる
      - 地の文: 友人が戻ってくる。テーブルには新しい水のグラスが置かれていて、「サンキュ」とだけ言って座り直した。
        表情: { 友人: normal }
        条件: choice_03 == A
      - 地の文: 友人が戻ってくる。頼まれていた水はそのままで、「あれ、水は？」と自分で店員を呼んだ。
        表情: { 友人: normal }
        条件: choice_03 == B
      - 地の文: 店を出て、3人で街をぶらぶらする。特に目的はないが、それが逆に心地よい。
        背景: bg_town_day
      - 歩く並びは自然と入れ替わって、友人が真ん中になったり、こちらが真ん中になったりを繰り返した。
      - 信号で立ち止まるたび、会話の相手も少しずつ入れ替わっていく。
      - 雑貨屋の前で彼女が足を止め、友人が「なんかあった？」と後ろから覗き込む。
      - そういう場面では、こちらは自然と一歩下がった位置にいた。
      - それが正しい距離だと、思っていた。
      - 三人でいるはずなのに、会話が二人ずつに分かれる時間が、少しずつ増えていた。
      - 友人: そういや、次の飲み会いつだっけ？お前も来いよ
      - 彼女: 私も誘ってよ、たまには
      - 友人: お前は俺と来ればいいだろ
      - 彼女: そういうことじゃなくて
      - 友人は笑って流したが、彼女はもう一度、こちらを見て言った。
      - 彼女: ちゃんと、誘ってよ
        表情: normal
      - 軽い口調だったが、彼女の言葉には少しだけ芯があった。
    選択肢:
      id: choice_04
      効果音: se_select
      options:
        - A: 「お前が決めろよ」と友人に話を振り返す
        - B: 「じゃあ、次は声かけますね」と彼女に直接返事をする
          警戒度: 1
    選択後:
      - 地の文: 友人が一瞬だけ、こちらを見た。それだけだった。
        条件: choice_04 == B
    次: scene_05

  # ───────────────────────────────────────────
  - id: scene_05
    見出し: 離脱②（電話）
    背景: bg_town_day
    本文:
      - 地の文: 友人のスマホが鳴る。「あ、ちょっと出るわ、仕事の電話」と少し離れた場所へ行ってしまう。
        表情: { 友人: null }
      - 友人が席を外すのは、今日これで二度目だった。
      - 残された2人はなんとなく歩道の端に寄って、友人の背中が見える距離で足を止める。
      - 彼女: 休日でも鳴るんだよね、あの人の電話
        表情: normal
      - 呆れたような、慣れたような言い方だった。
      - 話すことがなくなって、視線が近くの店先へ流れる。
      - 彼女もそちらを見ていた。ショーウィンドウに、ずいぶん昔から続いているシリーズの新作が並んでいる。
      - 彼女: あ、これ。私、昔から好きなんだ
      - 彼女が口にしたタイトルには、覚えがあった。学生の頃、こちらもひととおり通っている。
      - 彼女: 言われるんだよね、いつも。まだやってるの、って
        表情: bored
      - 少しだけ、拗ねたような言い方だった。
      - 友人はまだ電話の途中で、こちらに背を向けたまま何度も頷いている。
    選択肢:
      id: choice_05
      効果音: se_select
      options:
        - A: 彼女の好きなものに素直に共感する
          好感度: 1
        - B: 当たり障りなく相槌を打つ
    選択後:
      - 彼女: え、それ好きなの？意外と気が合うかも、私たち
        声: voice_03
        表情: laugh
        条件: choice_05 == A
      - 地の文: 少しだけ声が大きくなって、彼女は自分でそれに気づいたように口をつぐんだ。
        条件: choice_05 == A
    次: scene_06

  # ───────────────────────────────────────────
  - id: scene_06
    見出し: 再開②（夕方の移動）
    背景: bg_town_evening
    BGM: bgm_evening
    本文:
      - 地の文: 電話を終えた友人が戻ってくる。日が傾き始める。解散の時間が近づいていた。
        表情: { 友人: normal }
      - 3人で歩く速度が、さっきより少しだけ落ちていた。誰も帰ろうとは言い出さない。
      - 彼女: ……もう夕方だね
      - 誰にともなく彼女がそう言って、それきり少しの間、誰も返事をしなかった。
      - 友人: なんか今日、俺そんな喋ってなくね？お前らだけで盛り上がってたし
        表情: { 友人: normal }
      - 地の文: 彼女の表情が、わずかに曇った。
        表情: { 彼女: bored }
      - 悪気のない声だった。責めるつもりも、疑うつもりもない。
      - ただ、その言葉が落ちた場所だけ、空気がわずかに固くなった。
      - 彼女は何も言わず、視線を足元に落としている。
      - だからこそ、何と返せばいいのか分からなかった。
      - この沈黙が、一番まずかった。
      - ここでどう答えるかで、今日の終わり方が決まる気がした。
    選択肢:
      id: choice_06
      効果音: se_select
      options:
        - A: 「そんなことないだろ」
        - B: 苦笑いだけで流す
          警戒度: 1
    次: scene_07

  # ───────────────────────────────────────────
  - id: scene_07
    見出し: 離脱③（売店）
    背景: bg_town_evening
    本文:
      - 地の文: 「飲み物買ってくる」と友人が売店の列に並ぶ。
        表情: { 友人: null }
      - 夕方の売店は思ったより混んでいて、友人の順番はまだ先だった。
      - 何を買うか決めていないらしく、列の途中で何度も棚の方を見ている。
      - 今日何度目かの、二人だけの時間。
      - これまでと違って、どちらも会話を探そうとしなかった。
      - 沈黙が気まずくないことのほうが、たぶん問題だった。
      - 彼女は、列に並ぶ友人の背中をしばらく見ていた。
      - 何か言おうとして、やめて、また言おうとした。
      - それから、こちらを見ないまま口を開く。
      - 地の文: 彼女の表情が、今までと少し違う。
        BGM: bgm_honne
      - 彼女: ……今日、ずっと居心地よくて。こんなこと思っちゃいけないのに、正直言うと──ちょっと惹かれてる自分がいる。……ごめん、今の忘れて
        声: voice_04
        表情: away
      - 言い終えてから、彼女は自分の言葉に驚いたような顔をした。
      - 忘れられるようなことなら、彼女も最初から言わなかったはずだった。
      - 売店の列は、まだ動かない。
    選択肢:
      id: choice_07
      効果音: se_select
      options:
        - A: 気持ちに応える言葉を返す
          好感度: 3
          警戒度: 1
        - B: 一歩引いて流す
          好感度: 1
        - C: はっきり距離を置く
          好感度: -1
    次: scene_08

  # ───────────────────────────────────────────
  - id: scene_08
    見出し: 解散前
    背景: bg_town_evening
    BGM: bgm_evening
    本文:
      - 地の文: 売店の列から友人が戻ってくる。両手にペットボトル。
        表情: { 友人: normal }
      - 「めっちゃ並んだわ」と言いながら、一本をこちらに放って寄越した。
      - 受け取ったペットボトルの冷たさが、手のひらに現実を戻してくる。
      - さっきの言葉の余韻が、まだ二人の間に残っている。
      - 彼女はもう、普通の顔をしていた。少なくとも、そう見えるようにしていた。
      - この数秒の自分たちを、友人は当然、見ている。
    選択肢:
      id: choice_08
      効果音: se_select
      options:
        - A: 何事もなかったように友人へ歩み寄る
        - B: 彼女と目を合わせたまま、一瞬動けない
          警戒度: 1
    選択後:
      - 3人で駅の方へ歩き出す。今日はここで終わりだ、という空気になっていた。
      - 来た時と同じ道のはずなのに、行きよりずいぶん短く感じた。
      - 信号が変わるのを待つ間、友人がこちらを向いた。
      - 友人: な、今日は声かけてよかっただろ？またこの3人で遊ぼうぜ
        声: voice_05
        表情: { 友人: normal, 彼女: normal }
        条件: warning < WARNING_THRESHOLD
      - 友人: ……お前ら、なんかさっきから様子おかしくないか？
        声: voice_06
        表情: { 友人: suspicious, 彼女: bored }
        条件: warning >= WARNING_THRESHOLD
    次:
      - 条件: warning >= WARNING_THRESHOLD
        行き先: ending_bare
      - 条件: affection < AFFECTION_LOW
        行き先: ending_none
      - 条件: affection < AFFECTION_HIGH
        行き先: ending_reject
      - 行き先: ending_success

  # ───────────────────────────────────────────
  - id: ending_bare
    見出し: ①バレエンド
    エンディング: true
    背景: bg_town_evening
    BGM: null
    本文:
      - その場は笑って誤魔化した。
      - 地の文: だが解散の間際、彼女が先に歩き出したあと、友人が不意に足を止めた。
        表情: { 彼女: null }
      - 友人: ……お前、なんで彼女とそんな空気になってんの？さっきから見てりゃ分かるよ
        声: voice_07
        表情: cold
      - 何と答えたのかは、あまり覚えていない。
      - ただ、否定の言葉が最後まで出てこなかったことだけは覚えている。
      - その日を境に、友人との連絡は途絶えた。
      - 友人と彼女が別れたらしいと共通の知人から聞いたのは、それからずっと後のことだった。

  # ───────────────────────────────────────────
  - id: ending_none
    見出し: ②進展なしエンド
    エンディング: true
    背景: bg_town_day
    BGM: bgm_daily
    本文:
      - 地の文: それから数週間が過ぎた。あの日のことは、結局誰も口にしないままだった。
        表情: { 友人: null, 彼女: null }
      - 友人: なあ、また3人で飲もうぜ。……あいつも行きたいって言ってたから
        声: voice_08
        表情: normal
      - 彼女とは、結局それ以上でもそれ以下でもなかった。何も起こらないまま、日常が戻っていく。
      - あの日の4時間が特別だったのかどうかも、今となっては分からない。
      - それでよかったのだと、今は思う。

  # ───────────────────────────────────────────
  - id: ending_reject
    見出し: ③拒否エンド
    エンディング: true
    背景: bg_town_evening
    BGM: bgm_ending
    本文:
      - 地の文: 友人が店の前で足を止め、ショーウィンドウを覗き込んでいる。その短い間だった。
        表情: { 友人: null }
      - 彼女はこちらを見ずに、はっきりとした声で言った。
      - 彼女: ……さっきのは、忘れて。私、{{friendName}}のこと、ちゃんと好きだから
        声: voice_09
        表情: away
      - 彼女の言葉に、それ以上何も言えなかった。芽生えかけた何かは、彼女自身の意思で終わった。
      - 戻ってきた友人に、彼女はいつも通りの顔で笑いかけた。
      - その横で、こちらだけがうまく笑えなかった。

  # ───────────────────────────────────────────
  - id: ending_success
    見出し: ④成功エンド
    エンディング: true
    背景: bg_town_evening
    BGM: bgm_ending
    本文:
      - 地の文: 別れ際、友人が少し先を歩いていったあと、彼女が一歩だけこちらに近づいた。
        表情: { 友人: null }
      - 彼女: ……ねえ、今日だけの話にしたくない。私も、ちゃんと考えたい
        声: voice_10
        表情: fluster
      - 4時間前には想像もしていなかった感情を抱えたまま、3人での一日が終わる。何かが、確かに変わってしまった。
      - 連絡先を交換したわけでもない。約束をしたわけでもない。
      - それでも、次に3人で会う日のことを、もう考えていた。
      - ──彼がまた、席を外すときのことを。
